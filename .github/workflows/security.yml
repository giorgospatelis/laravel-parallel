name: Security Scanning

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run daily security scans at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

# Cancel outdated workflow runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer-audit:
    name: Composer Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: security-php-8.3-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: security-php-8.3-composer-

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run Composer Audit
        run: |
          echo "🔍 Checking for known security vulnerabilities..."
          composer audit --no-dev --format=table

          # Fail on high or critical vulnerabilities
          AUDIT_OUTPUT=$(composer audit --no-dev --format=json 2>&1 || true)
          if echo "$AUDIT_OUTPUT" | grep -q '"severity":"high"' || echo "$AUDIT_OUTPUT" | grep -q '"severity":"critical"'; then
            echo "❌ High or critical vulnerabilities found!"
            exit 1
          fi
          echo "✅ No high or critical vulnerabilities found"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: always

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for comprehensive scanning

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  phpstan-security:
    name: PHPStan Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: security-phpstan-php-8.3-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: security-phpstan-php-8.3-composer-

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan Security Analysis
        run: |
          composer phpstan -- --error-format=github
          echo "✅ PHPStan security analysis completed"

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [composer-audit, secret-scan, phpstan-security]
    if: always()

    steps:
      - name: Check scan results
        run: |
          echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.composer-audit.result }}" == "success" ]; then
            echo "✅ Composer Audit: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Composer Audit: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.secret-scan.result }}" == "success" ]; then
            echo "✅ Secret Scanning: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Secret Scanning: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.phpstan-security.result }}" == "success" ]; then
            echo "✅ PHPStan Analysis: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ PHPStan Analysis: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Fail if any critical job failed
          if [ "${{ needs.composer-audit.result }}" != "success" ] || \
             [ "${{ needs.secret-scan.result }}" != "success" ] || \
             [ "${{ needs.phpstan-security.result }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ One or more security scans failed. Review the results above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 All security scans passed successfully!" >> $GITHUB_STEP_SUMMARY
