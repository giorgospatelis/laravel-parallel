name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

# Cancel outdated workflow runs on rapid pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests - PHP 8.3 / Laravel 11 (Informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true  # Don't fail CI if tests fail

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: dependencies-php-8.3-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: dependencies-php-8.3-composer-

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run test suite
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        continue-on-error: true  # Tests are informational only
        run: |
          echo "=== Environment Info ==="
          php -v
          composer show laravel/framework | head -5
          composer show orchestra/testbench | head -5
          composer show pestphp/pest | head -5
          echo "=== Running Tests ==="
          composer test || echo "Tests failed but CI will continue"

  code-quality:
    name: Code Quality - PHPStan & Pint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: dependencies-php-8.3-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: dependencies-php-8.3-composer-

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan (Level 9)
        run: composer phpstan

      - name: Run Laravel Pint (Code Style)
        run: composer format:test

  security:
    name: Security - Composer Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: dependencies-php-8.3-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: dependencies-php-8.3-composer-

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run security audit
        run: composer audit --no-dev

  status-check:
    name: Required CI Checks Passed
    runs-on: ubuntu-latest
    needs: [tests, code-quality, security]
    if: always()

    steps:
      - name: Check required jobs status
        run: |
          # Tests are informational only - don't fail on test failures
          echo "Tests result: ${{ needs.tests.result }} (informational)"

          # Only fail if code-quality or security fail
          if [ "${{ needs.code-quality.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ]; then
            echo "Required CI jobs (code-quality or security) failed"
            exit 1
          fi
          echo "All required CI checks passed successfully!"
          echo "Note: Tests are currently informational and do not block CI"
