name: Extended Compatibility Testing

on:
  schedule:
    # Run weekly on Sundays at 4 AM UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

# Cancel outdated workflow runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility-matrix:
    name: ${{ matrix.os }} / PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*']
        include:
          # Test PHP nightly builds on Ubuntu only
          - os: ubuntu-latest
            php: '8.4'
            laravel: '12.*'
            experimental: true

    continue-on-error: ${{ matrix.experimental || false }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: compat-${{ matrix.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            compat-${{ matrix.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-
            compat-${{ matrix.os }}-php-${{ matrix.php }}-
            compat-${{ matrix.os }}-

      - name: Install dependencies (Unix)
        if: runner.os != 'Windows'
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress
        shell: pwsh

      - name: Run test suite (Unix)
        if: runner.os != 'Windows'
        run: composer test

      - name: Run test suite (Windows)
        if: runner.os == 'Windows'
        run: composer test
        shell: pwsh

      - name: Run PHPStan
        run: composer phpstan

  summary:
    name: Compatibility Summary
    runs-on: ubuntu-latest
    needs: compatibility-matrix
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 🧪 Extended Compatibility Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Testing complete across multiple platforms and PHP/Laravel versions." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.compatibility-matrix.result }}" == "success" ]; then
            echo "✅ All compatibility tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Some compatibility tests failed. Review the matrix results above." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tested Platforms:" >> $GITHUB_STEP_SUMMARY
          echo "- Ubuntu (Linux)" >> $GITHUB_STEP_SUMMARY
          echo "- macOS (Darwin)" >> $GITHUB_STEP_SUMMARY
          echo "- Windows" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tested PHP Versions:" >> $GITHUB_STEP_SUMMARY
          echo "- PHP 8.2, 8.3, 8.4" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tested Laravel Versions:" >> $GITHUB_STEP_SUMMARY
          echo "- Laravel 11.*, 12.*" >> $GITHUB_STEP_SUMMARY
