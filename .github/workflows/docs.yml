name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Cancel outdated workflow runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-docs:
    name: Generate API Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: docs-php-8.3-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: docs-php-8.3-composer-

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Install phpDocumentor
        run: |
          wget https://phpdoc.org/phpDocumentor.phar
          chmod +x phpDocumentor.phar

      - name: Generate API Documentation
        run: |
          mkdir -p build/docs
          ./phpDocumentor.phar run \
            --directory=src \
            --target=build/docs/api \
            --title="Laravel Parallel API Documentation" \
            --template=clean

      - name: Copy README and assets
        run: |
          cp README.md build/docs/
          cp CHANGELOG.md build/docs/
          if [ -d "docs" ]; then
            cp -r docs/* build/docs/
          fi
          if [ -d "art" ]; then
            mkdir -p build/docs/art
            cp -r art/* build/docs/art/
          fi

      - name: Create documentation index
        run: |
          cat > build/docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Laravel Parallel Documentation</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
                      line-height: 1.6;
                      color: #333;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      min-height: 100vh;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      padding: 20px;
                  }
                  .container {
                      max-width: 800px;
                      background: white;
                      border-radius: 20px;
                      padding: 60px 40px;
                      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
                  }
                  h1 {
                      font-size: 3em;
                      margin-bottom: 20px;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      -webkit-background-clip: text;
                      -webkit-text-fill-color: transparent;
                      background-clip: text;
                  }
                  p {
                      font-size: 1.2em;
                      color: #666;
                      margin-bottom: 40px;
                  }
                  .links {
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                      gap: 20px;
                  }
                  .link {
                      display: block;
                      padding: 20px;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      color: white;
                      text-decoration: none;
                      border-radius: 10px;
                      text-align: center;
                      font-weight: 600;
                      transition: transform 0.2s, box-shadow 0.2s;
                  }
                  .link:hover {
                      transform: translateY(-2px);
                      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
                  }
                  .badge {
                      display: inline-block;
                      margin: 5px;
                  }
                  .badges {
                      margin: 30px 0;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Laravel Parallel</h1>
                  <p>Simple parallel processing for Laravel - Powered by AMPHP with automatic CPU detection</p>

                  <div class="badges">
                      <img src="https://img.shields.io/packagist/v/laravel-parallel/laravel-parallel" alt="Version" class="badge">
                      <img src="https://img.shields.io/packagist/dt/laravel-parallel/laravel-parallel" alt="Downloads" class="badge">
                      <img src="https://img.shields.io/packagist/l/laravel-parallel/laravel-parallel" alt="License" class="badge">
                  </div>

                  <div class="links">
                      <a href="api/index.html" class="link">📚 API Documentation</a>
                      <a href="https://github.com/laravel-parallel/laravel-parallel" class="link">💻 GitHub Repository</a>
                      <a href="https://packagist.org/packages/laravel-parallel/laravel-parallel" class="link">📦 Packagist</a>
                      <a href="CHANGELOG.html" class="link">📝 Changelog</a>
                  </div>
              </div>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'build/docs'

  deploy-docs:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: generate-docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "## 📚 Documentation Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Documentation has been successfully generated and deployed to GitHub Pages." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View at: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
