name: Community Bot

on:
  issues:
    types: [opened, labeled]
  discussion:
    types: [created]
  issue_comment:
    types: [created]

permissions:
  issues: write
  discussions: write

jobs:
  issue-triage:
    name: Auto-label and Triage Issues
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'opened'
    timeout-minutes: 5

    steps:
      - name: Auto-label issue type
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title.toLowerCase();
            const body = issue.body ? issue.body.toLowerCase() : '';
            const labels = [];

            // Detect bug reports
            if (title.includes('bug') || title.includes('error') || title.includes('issue') ||
                body.includes('bug') || body.includes('error') || body.includes('exception')) {
              labels.push('bug');
            }

            // Detect feature requests
            if (title.includes('feature') || title.includes('enhancement') || title.includes('add') ||
                body.includes('feature request') || body.includes('would be nice')) {
              labels.push('enhancement');
            }

            // Detect documentation issues
            if (title.includes('docs') || title.includes('documentation') || title.includes('readme') ||
                body.includes('documentation') || body.includes('docs')) {
              labels.push('documentation');
            }

            // Detect questions
            if (title.includes('how to') || title.includes('how do') || title.includes('?') ||
                body.includes('how to') || body.includes('how can i')) {
              labels.push('question');
            }

            // Add labels
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labels
              });
            }

  faq-responder:
    name: FAQ Auto-responder
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'opened'
    timeout-minutes: 5

    steps:
      - name: Respond to common questions
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title.toLowerCase();
            const body = issue.body ? issue.body.toLowerCase() : '';
            let response = null;

            // FAQ: Installation issues
            if (title.includes('install') || body.includes('composer require')) {
              response = `### Installation Help

            To install Laravel Parallel, ensure you meet the requirements:
            - PHP 8.2 or higher
            - Laravel 11.0 or higher

            Then run:
            \`\`\`bash
            composer require laravel-parallel/laravel-parallel
            \`\`\`

            If you're having issues, please provide:
            - Your PHP version (\`php -v\`)
            - Your Laravel version
            - The exact error message
            - Your composer.json requirements

            For more details, see: https://github.com/${context.repo.owner}/${context.repo.repo}#installation
            `;
            }

            // FAQ: How to use
            if ((title.includes('how to') || title.includes('usage')) && !response) {
              response = `### Usage Guide

            Here's a quick example to get started:

            \`\`\`php
            use LaravelParallel\\Facades\\Parallel;

            $results = Parallel::run([
                'task1' => fn() => expensive_operation_1(),
                'task2' => fn() => expensive_operation_2(),
                'task3' => fn() => expensive_operation_3(),
            ]);

            foreach ($results as $key => $result) {
                if ($result->isSuccess()) {
                    echo "Task {$key}: {$result->getValue()}\\n";
                }
            }
            \`\`\`

            For comprehensive examples and documentation, see:
            - [README Documentation](https://github.com/${context.repo.owner}/${context.repo.repo}#readme)
            - [Usage Examples](https://github.com/${context.repo.owner}/${context.repo.repo}#usage-examples)

            If you have a specific question, please provide more details!
            `;
            }

            // FAQ: Performance questions
            if ((title.includes('performance') || title.includes('slow') || title.includes('faster')) && !response) {
              response = `### Performance Optimization

            Laravel Parallel is most effective for:
            - CPU-bound tasks (data processing, calculations)
            - Task sets with 10+ tasks
            - Tasks taking 100ms or longer each

            **Not ideal for:**
            - Micro-tasks (<100ms)
            - I/O-bound operations (use Laravel Queues instead)
            - Small datasets

            See our [Performance Guide](https://github.com/${context.repo.owner}/${context.repo.repo}#performance) for detailed information.

            If you're experiencing performance issues, please share:
            - Number of tasks you're running
            - Average task duration
            - Worker count configuration
            - Your CPU core count
            `;
            }

            // Post response if matched
            if (response) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: response + '\n\n---\n🤖 This is an automated response. A maintainer will follow up if needed.'
              });
            }

  support-redirect:
    name: Redirect Support Questions
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'question')
    timeout-minutes: 5

    steps:
      - name: Suggest Stack Overflow
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;

            // Only suggest SO if no FAQ response was given (check if bot already commented)
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number
            });

            const botCommented = comments.data.some(c => c.user.type === 'Bot');

            if (!botCommented) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `### 💬 Support Question

            For general support questions and troubleshooting, we recommend:

            1. **Stack Overflow** - Tag your question with \`laravel-parallel\`
            2. **GitHub Discussions** - For broader conversations: https://github.com/${context.repo.owner}/${context.repo.repo}/discussions
            3. **Laravel Community** - The Laravel Discord and forums

            GitHub Issues are primarily for **bug reports** and **feature requests**.

            If this is a bug report, please provide:
            - Steps to reproduce
            - Expected vs actual behavior
            - Code samples
            - Environment details (PHP version, Laravel version, etc.)

            ---
            🤖 This is an automated message to help direct your question to the right place.
            `
              });
            }

  lock-resolved-threads:
    name: Lock Resolved Threads
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Lock closed issues and PRs
        uses: dessant/lock-threads@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          issue-inactive-days: 30
          pr-inactive-days: 30
          issue-comment: |
            This issue has been automatically locked since there has not been any recent activity
            after it was closed. Please open a new issue for related bugs or questions.
          pr-comment: |
            This pull request has been automatically locked since there has not been any recent
            activity after it was closed. Please open a new issue for related bugs or questions.
